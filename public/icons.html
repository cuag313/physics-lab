<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NB物理实验 - 实验器具图片浏览器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; }
    .header { background: #16213e; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 24px; margin-bottom: 10px; }
    .stats { color: #aaa; font-size: 14px; }
    .controls { margin-top: 10px; }
    .controls input { padding: 8px 16px; width: 300px; border: none; border-radius: 20px; background: #0f3460; color: #fff; font-size: 14px; }
    .controls input::placeholder { color: #666; }
    .controls select { padding: 8px; border: none; border-radius: 20px; background: #0f3460; color: #fff; margin-left: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 20px; }
    .card { background: #16213e; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 150px; object-fit: contain; background: #fff; }
    .card .name { padding: 8px; font-size: 12px; color: #aaa; text-align: center; word-break: break-all; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .modal .close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; }
    .modal .info { position: absolute; bottom: 20px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>NB物理实验 - 实验器具图片</h1>
    <div class="stats">共 <span id="count">0</span> 张图片</div>
    <div class="controls">
      <input type="text" id="search" placeholder="搜索图片...">
      <select id="typeFilter">
        <option value="all">全部</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="modal" id="modal">
    <span class="close">&times;</span>
    <img id="modalImg">
    <div class="info" id="modalInfo"></div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    const typeFilter = document.getElementById('typeFilter');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalInfo = document.getElementById('modalInfo');

    // 加载图片列表
    let images = [];
    fetch('/icons-manifest.json')
      .then(r => r.json())
      .then(list => {
        images = list.map(p => ({ name: p.split('/').pop(), path: p }));
        count.textContent = images.length;
        renderImages(images);
      })
      .catch(e => {
        console.error(e);
        grid.innerHTML = '<p style="text-align:center;padding:40px;color:#666;">加载失败: ' + e.message + '</p>';
      });

    function renderImages(imgs) {
      grid.innerHTML = '';
      imgs.forEach(img => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${img.path}" alt="${img.name}" loading="lazy">
          <div class="name">${img.name}</div>
        `;
        card.onclick = () => {
          modalImg.src = img.path;
          modalInfo.textContent = img.name;
          modal.classList.add('active');
        };
        grid.appendChild(card);
      });
    }

    modal.onclick = (e) => {
      if (e.target === modal || e.target.className === 'close') {
        modal.classList.remove('active');
      }
    };

    search.oninput = () => {
      const q = search.value.toLowerCase();
      const filtered = images.filter(img => img.name.toLowerCase().includes(q));
      renderImages(filtered);
    };

    typeFilter.onchange = () => {
      const type = typeFilter.value;
      const filtered = type === 'all' ? images : images.filter(img => img.name.endsWith('.' + type));
      renderImages(filtered);
    };
  </script>
</body>
</html>
