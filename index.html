<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>物理仿真实验室</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var html = document.documentElement

        function syncMode() {
          var physLand = window.matchMedia('(orientation: landscape)').matches && window.innerWidth <= 900
          var forced = html.classList.contains('force-landscape')
          html.classList.toggle('mode-landscape', physLand || forced)
        }

        function enableForceLandscape() {
          html.classList.add('force-landscape')
          html.classList.add('mode-landscape')
          nudgeCanvases()
        }

        function disableForceLandscape() {
          html.classList.remove('force-landscape')
          syncMode()
          nudgeCanvases()
        }

        // 强制横屏会改变布局尺寸；场景普遍监听 window.resize 重设 canvas 位图。
        // 不发事件的话，canvas 仍停留在进实验前的宽高，画面被拉伸/裁切像死截图。
        function nudgeCanvases() {
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event('resize'))
            setTimeout(function () { window.dispatchEvent(new Event('resize')) }, 80)
          })
        }

        // 真横屏时清掉强制，避免双重
        function onOrient() {
          if (window.matchMedia('(orientation: landscape)').matches) {
            html.classList.remove('force-landscape')
          }
          syncMode()
          // 这里不要再 nudgeCanvases：nudge 会派发 resize，形成死循环
        }
        window.addEventListener('orientationchange', onOrient)
        window.addEventListener('resize', onOrient)

        // 进实验：统一横屏；回目录由 LabPage 调 mimoExitLandscape
        window.mimoEnterLandscape = function () {
          if (window.matchMedia('(orientation: landscape)').matches && window.innerWidth <= 900) {
            html.classList.remove('force-landscape')
            syncMode()
            nudgeCanvases()
            return
          }
          if (window.innerWidth <= 900) {
            enableForceLandscape()
          } else {
            nudgeCanvases()
          }
        }
        window.mimoExitLandscape = disableForceLandscape
        syncMode()
      })()
    </script>
  </body>
</html>
