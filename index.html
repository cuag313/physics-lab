<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>物理仿真实验室</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; overscroll-behavior: none; touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var html = document.documentElement

        function syncMode() {
          var physLand = window.matchMedia('(orientation: landscape)').matches && window.innerWidth <= 900
          var forced = html.classList.contains('force-landscape')
          html.classList.toggle('mode-landscape', physLand || forced)
        }

        function enableForceLandscape() {
          html.classList.add('force-landscape')
          html.classList.add('mode-landscape')
        }

        function disableForceLandscape() {
          html.classList.remove('force-landscape')
          syncMode()
        }

        // 强制横屏会改变布局尺寸；场景普遍监听 window.resize 重设 canvas 位图。
        function nudgeCanvases() {
          requestAnimationFrame(function () {
            window.dispatchEvent(new Event('resize'))
            setTimeout(function () { window.dispatchEvent(new Event('resize')) }, 80)
          })
        }

        function inExperiment() {
          return document.body.classList.contains('in-experiment')
        }

        function isPhysLandscape() {
          return window.matchMedia('(orientation: landscape)').matches && window.innerWidth <= 900
        }

        /** 实验中保持横屏：息屏/转屏/回前台后自动恢复，避免变成「竖版横屏」 */
        function ensureExperimentLandscape() {
          if (!inExperiment()) return
          if (window.innerWidth > 900) {
            // 桌面
            html.classList.remove('force-landscape')
            syncMode()
            return
          }
          if (isPhysLandscape()) {
            // 已物理横屏：去掉强制旋转，只保留横屏布局
            html.classList.remove('force-landscape')
            syncMode()
          } else {
            // 竖持手机：强制横屏铺满
            enableForceLandscape()
            syncMode()
          }
        }

        function onOrient() {
          ensureExperimentLandscape()
          // 不要在这里 nudgeCanvases：会与 resize 形成循环
        }
        window.addEventListener('orientationchange', onOrient)
        window.addEventListener('resize', onOrient)

        // 息屏再打开 / 切后台回来：恢复横屏并重绘
        function onWake() {
          ensureExperimentLandscape()
          if (inExperiment()) nudgeCanvases()
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') onWake()
        })
        window.addEventListener('pageshow', onWake)
        window.addEventListener('focus', onWake)

        // 进实验：统一横屏；回目录由 LabPage 调 mimoExitLandscape
        window.mimoEnterLandscape = function () {
          ensureExperimentLandscape()
          nudgeCanvases()
        }
        window.mimoExitLandscape = function () {
          disableForceLandscape()
          nudgeCanvases()
        }
        syncMode()
      })()
    </script>
  </body>
</html>
